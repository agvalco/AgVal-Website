<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" role="img" aria-label="AgVal — Appraisal & Real Estate Solutions">
  <defs>
    <linearGradient id="green-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#1B4D2E"/>
      <stop offset="55%" stop-color="#164026"/>
      <stop offset="100%" stop-color="#0F3320"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#E5C766"/>
      <stop offset="45%" stop-color="#D4B23C"/>
      <stop offset="100%" stop-color="#A8841C"/>
    </linearGradient>
    <linearGradient id="gold-shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%"  stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#F6ECC8"/>
      <stop offset="100%" stop-color="#A8841C"/>
    </linearGradient>
    <radialGradient id="sun-grad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#F6ECC8"/>
      <stop offset="55%"  stop-color="#E5C766"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </radialGradient>
    <linearGradient id="hill-green" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#245C39"/>
      <stop offset="100%" stop-color="#0F3320"/>
    </linearGradient>
    <linearGradient id="hill-gold" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%"  stop-color="#E5C766"/>
      <stop offset="100%" stop-color="#A8841C"/>
    </linearGradient>
  </defs>

  <!-- AgVal wordmark -->
  <g font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-weight="800">
    <!-- "Ag" -->
    <text x="80"  y="180" font-size="200" fill="url(#green-grad)" letter-spacing="-4">Ag</text>
    <!-- "Val" -->
    <text x="280" y="180" font-size="200" fill="url(#gold-grad)" letter-spacing="-4">Val</text>
    <!-- subtle gold sheen over "Val" -->
    <text x="280" y="180" font-size="200" fill="url(#gold-shine)" letter-spacing="-4" opacity="0.35">Val</text>
  </g>

  <!-- Landscape band: sun + rolling hills + trees -->
  <g transform="translate(80 195)">
    <!-- Sun behind hills -->
    <circle cx="200" cy="22" r="34" fill="url(#sun-grad)"/>

    <!-- Back gold curve (sweeping field) -->
    <path d="M -10 50 Q 120 0 240 30 Q 360 60 410 30 L 410 80 L -10 80 Z"
          fill="url(#hill-gold)" opacity="0.95"/>

    <!-- Mid green hill -->
    <path d="M -10 55 Q 110 15 250 45 Q 350 70 410 50 L 410 90 L -10 90 Z"
          fill="url(#hill-green)"/>

    <!-- Front gold sweep -->
    <path d="M -10 72 Q 140 40 280 65 Q 360 80 410 70 L 410 105 L -10 105 Z"
          fill="url(#hill-gold)"/>

    <!-- Final green base -->
    <path d="M -10 92 Q 150 70 290 85 Q 360 95 410 90 L 410 120 L -10 120 Z"
          fill="url(#hill-green)"/>

    <!-- Pine trees on right -->
    <g transform="translate(320 18)">
      <!-- Tree 1 (front, slightly taller) -->
      <g transform="translate(0 0)">
        <rect x="13" y="48" width="4" height="10" fill="#0F3320"/>
        <polygon points="15,4 5,28 25,28" fill="url(#hill-green)"/>
        <polygon points="15,16 2,40 28,40" fill="url(#hill-green)"/>
        <polygon points="15,28 0,52 30,52" fill="url(#hill-green)"/>
      </g>
      <!-- Tree 2 (back, smaller) -->
      <g transform="translate(28 8)">
        <rect x="11" y="42" width="4" height="9" fill="#0F3320"/>
        <polygon points="13,6 5,26 21,26" fill="url(#hill-green)"/>
        <polygon points="13,16 3,36 23,36" fill="url(#hill-green)"/>
        <polygon points="13,28 0,46 26,46" fill="url(#hill-green)"/>
      </g>
    </g>
  </g>

  <!-- Tagline -->
  <text x="280" y="330"
        font-family="'Inter', 'Segoe UI', Arial, sans-serif"
        font-size="22"
        font-weight="600"
        letter-spacing="6"
        fill="#1B4D2E"
        text-anchor="middle">APPRAISAL &amp; REAL ESTATE SOLUTIONS</text>
</svg>
